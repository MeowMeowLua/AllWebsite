<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Carlos Games</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #0b0b0b;
    color: white;
    font-family: Arial, sans-serif;
}

/* =========================
   HEADER
========================= */

header {
    background: #151515;
    border-bottom: 2px solid #ff7a00;
    padding: 18px 25px;

    display: flex;
    align-items: center;
    gap: 18px;
}

.logo {
    color: #ff7a00;
    font-size: 26px;
    font-weight: bold;
    white-space: nowrap;
}

.search {
    flex: 1;
    max-width: 500px;

    background: #222;
    border: 1px solid #333;
    color: white;

    padding: 12px 15px;
    border-radius: 8px;

    outline: none;
}

.search:focus {
    border-color: #ff7a00;
}

.admin-button {
    margin-left: auto;

    background: #ff7a00;
    color: white;

    border: none;
    padding: 11px 15px;

    border-radius: 8px;

    font-weight: bold;
    cursor: pointer;
}

.admin-button:hover {
    background: #ff8c1a;
}

/* =========================
   GENERAL
========================= */

.container {
    max-width: 1200px;
    margin: auto;
    padding: 35px 20px;
}

.hero {
    background: #171717;

    border: 1px solid #292929;
    border-radius: 14px;

    padding: 35px;
    margin-bottom: 30px;
}

.hero h1 {
    font-size: 36px;
    margin-bottom: 10px;
}

.orange {
    color: #ff7a00;
}

.hero p {
    color: #999;
}

/* =========================
   CATEGORIES
========================= */

.categories {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;

    margin-bottom: 30px;
}

.category {
    background: #1c1c1c;

    border: 1px solid #333;
    color: #ccc;

    padding: 10px 16px;

    border-radius: 8px;
    cursor: pointer;
}

.category:hover,
.category.active {
    background: #ff7a00;
    border-color: #ff7a00;
    color: white;
}

/* =========================
   GAME CARDS
========================= */

.games {
    display: grid;

    grid-template-columns:
        repeat(auto-fill, minmax(220px, 1fr));

    gap: 20px;
}

.game {
    background: #171717;

    border: 1px solid #292929;
    border-radius: 12px;

    overflow: hidden;

    transition: 0.2s;
}

.game:hover {
    transform: translateY(-4px);
    border-color: #ff7a00;
}

.game-image {
    width: 100%;
    height: 140px;

    object-fit: cover;

    display: block;

    background: #111;
}

.game-content {
    padding: 17px;
}

.game-title {
    margin-bottom: 7px;
}

.game-category {
    color: #999;

    margin-bottom: 15px;

    font-size: 14px;
}

.play {
    display: block;
    width: 100%;

    background: #ff7a00;

    color: white;

    text-align: center;
    text-decoration: none;

    padding: 11px;

    border-radius: 7px;

    font-weight: bold;
}

.play:hover {
    background: #ff8c1a;
}

.empty {
    grid-column: 1 / -1;

    text-align: center;

    padding: 60px;

    color: #777;
}

/* =========================
   LOGIN
========================= */

#loginScreen {
    display: none;

    position: fixed;

    inset: 0;

    background: #0b0b0b;

    z-index: 999;

    align-items: center;
    justify-content: center;
}

.login-box {
    width: 350px;
    max-width: 90%;

    background: #171717;

    border: 1px solid #292929;

    border-radius: 14px;

    padding: 30px;

    text-align: center;
}

.login-box h1 {
    color: #ff7a00;

    margin-bottom: 10px;
}

.login-box p {
    color: #999;

    margin-bottom: 20px;
}

.error {
    color: #ff4d4d;

    margin-top: 12px;

    display: none;
}

/* =========================
   ADMIN
========================= */

#adminPage {
    display: none;
}

.admin-header {
    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 25px;
}

.back-button {
    background: #222;

    color: white;

    border: 1px solid #333;

    padding: 10px 15px;

    border-radius: 7px;

    cursor: pointer;
}

.back-button:hover {
    background: #333;
}

.panel {
    background: #171717;

    border: 1px solid #292929;

    border-radius: 12px;

    padding: 25px;

    margin-bottom: 20px;
}

.panel h2 {
    margin-bottom: 20px;
}

input,
select {
    width: 100%;

    background: #222;

    border: 1px solid #333;

    color: white;

    padding: 12px;

    border-radius: 7px;

    margin-bottom: 12px;

    outline: none;
}

input:focus,
select:focus {
    border-color: #ff7a00;
}

.save-button {
    background: #ff7a00;

    color: white;

    border: none;

    padding: 12px 20px;

    border-radius: 7px;

    font-weight: bold;

    cursor: pointer;
}

.save-button:hover {
    background: #ff8c1a;
}

/* ADMIN GAME */

.admin-game {
    background: #222;

    border-radius: 10px;

    padding: 15px;

    margin-bottom: 12px;

    display: flex;

    align-items: center;

    gap: 15px;
}

.admin-game img {
    width: 90px;
    height: 60px;

    object-fit: cover;

    border-radius: 7px;
}

.admin-info {
    flex: 1;
}

.admin-info p {
    color: #999;

    margin-top: 5px;
}

.edit-button {
    background: #555;

    color: white;

    border: none;

    padding: 9px 13px;

    border-radius: 7px;

    cursor: pointer;
}

.edit-button:hover {
    background: #666;
}

.delete-button {
    background: #c0392b;

    color: white;

    border: none;

    padding: 9px 13px;

    border-radius: 7px;

    cursor: pointer;
}

.delete-button:hover {
    background: #e74c3c;
}

/* =========================
   GAME PLAYER
========================= */

#gamePage {
    display: none;
}

.game-player-header {
    display: flex;

    align-items: center;

    gap: 15px;

    margin-bottom: 20px;
}

.game-player-header h1 {
    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;
}

.game-frame {
    width: 100%;

    height: 70vh;

    min-height: 500px;

    border: 1px solid #292929;

    border-radius: 12px;

    overflow: hidden;

    background: #111;
}

.game-frame iframe {
    width: 100%;
    height: 100%;

    border: none;

    display: block;
}

/* =========================
   GAME CONTROLS
========================= */

.game-controls {
    display: flex;

    gap: 10px;

    margin-top: 12px;

    flex-wrap: wrap;
}

.game-control {
    background: #222;

    color: white;

    border: 1px solid #333;

    padding: 12px 18px;

    border-radius: 8px;

    cursor: pointer;

    font-weight: bold;

    transition: 0.2s;
}

.game-control:hover {
    background: #ff7a00;

    border-color: #ff7a00;
}

/* =========================
   FOOTER
========================= */

footer {
    text-align: center;

    color: #666;

    padding: 40px;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    header {
        flex-wrap: wrap;
    }

    .logo {
        width: 100%;

        text-align: center;
    }

    .search {
        max-width: none;
    }

    .admin-button {
        margin-left: 0;
    }

    .hero h1 {
        font-size: 28px;
    }

    .admin-game {
        flex-wrap: wrap;
    }

    .game-player-header {
        flex-wrap: wrap;
    }

}

</style>
</head>

<body>

<!-- =========================
     HEADER
========================= -->

<header>

    <div class="logo">
        🎮 Carlos Games
    </div>

    <input
        id="search"
        class="search"
        type="text"
        placeholder="🔎 Search games..."
    >

    <button
        class="admin-button"
        onclick="openLogin()"
    >
        ⚙️ Admin Panel
    </button>

</header>


<!-- =========================
     HOME PAGE
========================= -->

<main id="homePage">

    <div class="container">

        <section class="hero">

            <h1>
                Welcome to
                <span class="orange">
                    Carlos Games
                </span>
            </h1>

            <p>
                Pick a game and start playing.
            </p>

        </section>


        <div
            class="categories"
            id="categories"
        ></div>


        <div
            class="games"
            id="gameList"
        ></div>

    </div>

</main>


<!-- =========================
     GAME PAGE
========================= -->

<main id="gamePage">

    <div class="container">

        <div class="game-player-header">

            <button
                class="back-button"
                onclick="closeGame()"
            >
                ← Back to Games
            </button>

            <h1 id="gamePlayerTitle">
                Game
            </h1>

        </div>


        <div
            class="game-frame"
            id="gameFrameContainer"
        >

            <iframe
                id="gameFrame"
                allowfullscreen
                title="Game">
            </iframe>

        </div>


        <!-- GAME BUTTONS -->

        <div class="game-controls">

            <button
                class="game-control"
                onclick="fullscreenGame()"
            >
                ⛶ Fullscreen
            </button>


            <button
                class="game-control"
                onclick="openGameWebsite()"
            >
                🌐 Open Website
            </button>

        </div>

    </div>

</main>


<!-- =========================
     LOGIN
========================= -->

<div id="loginScreen">

    <div class="login-box">

        <h1>
            🔐 Admin Login
        </h1>

        <p>
            Carlos Games
        </p>

        <input
            id="adminPassword"
            type="password"
            placeholder="Enter password"
        >

        <button
            class="save-button"
            onclick="login()"
        >
            Login
        </button>

        <div
            id="loginError"
            class="error"
        >
            Incorrect password.
        </div>

    </div>

</div>


<!-- =========================
     ADMIN PAGE
========================= -->

<main id="adminPage">

    <div class="container">

        <div class="admin-header">

            <div>

                <h1>
                    ⚙️ Admin Panel
                </h1>

                <p style="color:#999;">
                    Manage Carlos Games
                </p>

            </div>


            <button
                class="back-button"
                onclick="closeAdmin()"
            >
                ← Back
            </button>

        </div>


        <!-- ADD GAME -->

        <div class="panel">

            <h2 id="formTitle">
                ➕ Add Game
            </h2>


            <input
                id="gameName"
                type="text"
                placeholder="Game name"
            >


            <select id="gameCategory">

                <option value="">
                    Choose category
                </option>

                <option value="Action">
                    Action
                </option>

                <option value="Adventure">
                    Adventure
                </option>

                <option value="Racing">
                    Racing
                </option>

                <option value="Puzzle">
                    Puzzle
                </option>

                <option value="Sports">
                    Sports
                </option>

                <option value="Arcade">
                    Arcade
                </option>

                <option value="Other">
                    Other
                </option>

            </select>


            <input
                id="gameURL"
                type="text"
                placeholder="Game URL"
            >


            <input
                id="gameImage"
                type="text"
                placeholder="Thumbnail image URL"
            >


            <button
                class="save-button"
                onclick="saveGame()"
                id="saveGameButton"
            >
                Add Game
            </button>


            <button
                class="back-button"
                onclick="cancelEdit()"
                id="cancelButton"
                style="display:none; margin-left:8px;"
            >
                Cancel
            </button>

        </div>


        <!-- GAME LIST -->

        <div class="panel">

            <h2>
                🎮 Your Games
            </h2>

            <div id="adminGameList"></div>

        </div>

    </div>

</main>


<footer>
    Carlos Games © 2026
</footer>


<script>

/* =========================
   GAME DATA
========================= */

let games =
    JSON.parse(
        localStorage.getItem("carlosGames")
    ) || [];


let selectedCategory = "All";

let editingIndex = -1;

let currentGameURL = "";


/* =========================
   ADMIN PASSWORD
========================= */

const ADMIN_PASSWORD =
    "Ayeboysotuff67";


/* =========================
   SAVE GAMES
========================= */

function saveGames() {

    localStorage.setItem(
        "carlosGames",
        JSON.stringify(games)
    );

}


/* =========================
   LOGIN
========================= */

function openLogin() {

    document.getElementById("loginScreen")
        .style.display = "flex";

    document.getElementById("adminPassword")
        .focus();

}


function login() {

    const password =
        document.getElementById("adminPassword")
            .value;


    if (password === ADMIN_PASSWORD) {

        document.getElementById("loginScreen")
            .style.display = "none";


        document.getElementById("homePage")
            .style.display = "none";


        document.getElementById("gamePage")
            .style.display = "none";


        document.getElementById("adminPage")
            .style.display = "block";


        document.getElementById("adminPassword")
            .value = "";


        document.getElementById("loginError")
            .style.display = "none";


        displayAdminGames();

    } else {

        document.getElementById("loginError")
            .style.display = "block";

    }

}


/* ENTER KEY LOGIN */

document
    .getElementById("adminPassword")
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                login();

            }

        }
    );


/* =========================
   CLOSE ADMIN
========================= */

function closeAdmin() {

    document.getElementById("adminPage")
        .style.display = "none";


    document.getElementById("homePage")
        .style.display = "block";


    displayCategories();

    displayGames();

}


/* =========================
   SAVE / ADD GAME
========================= */

function saveGame() {

    const name =
        document.getElementById("gameName")
            .value.trim();


    const category =
        document.getElementById("gameCategory")
            .value;


    const url =
        document.getElementById("gameURL")
            .value.trim();


    const image =
        document.getElementById("gameImage")
            .value.trim();


    if (!name || !category || !url) {

        alert(
            "Please fill in the game name, category, and URL."
        );

        return;

    }


    const game = {

        name: name,

        category: category,

        url: url,

        image: image

    };


    if (editingIndex === -1) {

        games.push(game);

    } else {

        games[editingIndex] = game;

        editingIndex = -1;


        document.getElementById("formTitle")
            .textContent = "➕ Add Game";


        document.getElementById("saveGameButton")
            .textContent = "Add Game";


        document.getElementById("cancelButton")
            .style.display = "none";

    }


    saveGames();

    clearForm();

    displayAdminGames();

    displayCategories();

    displayGames();

}


/* =========================
   EDIT GAME
========================= */

function editGame(index) {

    const game = games[index];


    document.getElementById("gameName")
        .value = game.name;


    document.getElementById("gameCategory")
        .value = game.category;


    document.getElementById("gameURL")
        .value = game.url;


    document.getElementById("gameImage")
        .value = game.image || "";


    editingIndex = index;


    document.getElementById("formTitle")
        .textContent = "✏️ Edit Game";


    document.getElementById("saveGameButton")
        .textContent = "Save Changes";


    document.getElementById("cancelButton")
        .style.display = "inline-block";


    window.scrollTo({

        top: 0,

        behavior: "smooth"

    });

}


/* =========================
   CANCEL EDIT
========================= */

function cancelEdit() {

    editingIndex = -1;

    clearForm();


    document.getElementById("formTitle")
        .textContent = "➕ Add Game";


    document.getElementById("saveGameButton")
        .textContent = "Add Game";


    document.getElementById("cancelButton")
        .style.display = "none";

}


/* =========================
   DELETE GAME
========================= */

function deleteGame(index) {

    if (!confirm("Delete this game?")) {

        return;

    }


    games.splice(index, 1);

    saveGames();

    displayAdminGames();

    displayCategories();

    displayGames();

}


/* =========================
   CLEAR FORM
========================= */

function clearForm() {

    document.getElementById("gameName")
        .value = "";


    document.getElementById("gameCategory")
        .value = "";


    document.getElementById("gameURL")
        .value = "";


    document.getElementById("gameImage")
        .value = "";

}


/* =========================
   ADMIN GAME LIST
========================= */

function displayAdminGames() {

    const list =
        document.getElementById("adminGameList");


    list.innerHTML = "";


    if (games.length === 0) {

        list.innerHTML =
            '<p style="color:#777;">No games added yet.</p>';

        return;

    }


    games.forEach((game, index) => {

        const item =
            document.createElement("div");


        item.className = "admin-game";


        const image =
            game.image ||
            "https://via.placeholder.com/90x60?text=Game";


        item.innerHTML = `

            <img
                src="${escapeHTML(image)}"
                alt=""
                onerror="this.src='https://via.placeholder.com/90x60?text=Game'"
            >

            <div class="admin-info">

                <strong>
                    ${escapeHTML(game.name)}
                </strong>

                <p>
                    📂 ${escapeHTML(game.category)}
                </p>

            </div>

            <button
                class="edit-button"
                onclick="editGame(${index})"
            >
                Edit
            </button>

            <button
                class="delete-button"
                onclick="deleteGame(${index})"
            >
                Delete
            </button>

        `;


        list.appendChild(item);

    });

}


/* =========================
   CATEGORIES
========================= */

function displayCategories() {

    const box =
        document.getElementById("categories");


    const categories = [

        "All",

        ...new Set(

            games

                .map(game => game.category)

                .filter(Boolean)

        )

    ];


    box.innerHTML = "";


    categories.forEach(category => {

        const button =
            document.createElement("button");


        button.className =
            "category" +

            (

                category === selectedCategory

                    ? " active"

                    : ""

            );


        button.textContent =
            category;


        button.onclick = function() {

            selectedCategory =
                category;


            displayCategories();

            displayGames();

        };


        box.appendChild(button);

    });

}


/* =========================
   DISPLAY GAMES
========================= */

function displayGames() {

    const list =
        document.getElementById("gameList");


    const search =
        document
            .getElementById("search")
            .value
            .toLowerCase()
            .trim();


    const filtered =
        games.filter(game => {


            const gameName =
                String(game.name || "")
                    .toLowerCase();


            const gameCategory =
                String(game.category || "")
                    .toLowerCase();


            const matchesSearch =

                gameName.includes(search)

                ||

                gameCategory.includes(search);


            const matchesCategory =

                selectedCategory === "All"

                ||

                game.category === selectedCategory;


            return (

                matchesSearch

                &&

                matchesCategory

            );

        });


    list.innerHTML = "";


    if (filtered.length === 0) {

        list.innerHTML = `

            <div class="empty">

                <h2>
                    No games found
                </h2>

                <p>
                    Add games through the Admin Panel.
                </p>

            </div>

        `;

        return;

    }


    filtered.forEach(game => {

        const card =
            document.createElement("article");


        card.className = "game";


        /* IMAGE */

        const image =
            document.createElement("img");


        image.className =
            "game-image";


        image.src =
            game.image ||

            "https://via.placeholder.com/500x300?text=Game";


        image.alt =
            game.name;


        image.onerror = function() {

            this.src =
                "https://via.placeholder.com/500x300?text=Game";

        };


        /* CONTENT */

        const content =
            document.createElement("div");


        content.className =
            "game-content";


        content.innerHTML = `

            <h2 class="game-title">
                ${escapeHTML(game.name)}
            </h2>

            <p class="game-category">
                📂 ${escapeHTML(game.category)}
            </p>

        `;


        /* PLAY BUTTON */

        const play =
            document.createElement("a");


        play.className =
            "play";


        play.href = "#";


        play.textContent =
            "PLAY";


        play.onclick =
            function(event) {

                event.preventDefault();

                openGame(game);

            };


        content.appendChild(play);


        card.appendChild(image);

        card.appendChild(content);


        list.appendChild(card);

    });

}


/* =========================
   OPEN GAME
========================= */

function openGame(game) {

    if (!game.url) {

        alert(
            "This game has no URL."
        );

        return;

    }


    currentGameURL =
        game.url;


    document.getElementById("homePage")
        .style.display = "none";


    document.getElementById("adminPage")
        .style.display = "none";


    document.getElementById("gamePage")
        .style.display = "block";


    document.getElementById("gamePlayerTitle")
        .textContent = game.name;


    document.getElementById("gameFrame")
        .src = game.url;


    window.scrollTo({

        top: 0,

        behavior: "smooth"

    });

}


/* =========================
   CLOSE GAME
========================= */

function closeGame() {

    document.getElementById("gameFrame")
        .src = "about:blank";


    currentGameURL = "";


    document.getElementById("gamePage")
        .style.display = "none";


    document.getElementById("homePage")
        .style.display = "block";


    window.scrollTo({

        top: 0,

        behavior: "smooth"

    });

}


/* =========================
   FULLSCREEN
========================= */

function fullscreenGame() {

    const frame =
        document.getElementById("gameFrame");


    const container =
        document.getElementById("gameFrameContainer");


    if (container.requestFullscreen) {

        container.requestFullscreen();

    }

    else if (frame.requestFullscreen) {

        frame.requestFullscreen();

    }

    else if (container.webkitRequestFullscreen) {

        container.webkitRequestFullscreen();

    }

    else {

        alert(
            "Fullscreen is not supported by your browser."
        );

    }

}


/* =========================
   OPEN ORIGINAL WEBSITE
========================= */

function openGameWebsite() {

    if (!currentGameURL) {

        alert(
            "This game has no website URL."
        );

        return;

    }


    window.open(
        currentGameURL,
        "_blank",
        "noopener,noreferrer"
    );

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(text) {

    const div =
        document.createElement("div");


    div.textContent =
        String(text);


    return div.innerHTML;

}


/* =========================
   SEARCH
========================= */

document
    .getElementById("search")
    .addEventListener(
        "input",
        displayGames
    );


/* =========================
   START WEBSITE
========================= */

displayCategories();

displayGames();

</script>

</body>
</html>
